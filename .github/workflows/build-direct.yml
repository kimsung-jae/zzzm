이름: 코드스페이스 없이 APK 구축

온:
 워크플로우_dispatch:

권한:
 내용: 쓰기

직업:
 빌드:
 실행 중: 우분투-latest

 단계:
 - 이름: 체크아웃 저장소
 용도: actions/checkout@v4

 - 이름: Java 17 설정
 용도: actions/setup-java@v4
 함께:
 배포: 테무린
 자바 버전: '17'

 - 이름: Gradle 8.9 설정
 용도: gradle/actions/setup-gradle@v4
 함께:
 그래들 버전: '8.9'

 - 이름: 안드로이드 프로젝트 생성
 껍질: bash
 실행: |
 chmod + x "보글사다리_SHORT16_개별1 픽_MISS_GUARD_V1_원클릭.sh"
 bash "보글사다리_SHORT16_개별1 픽_MISS_GUARD_V1_원클릭.sh"

 - 이름: 빌드 디버그 APK
 껍질: bash
 실행: Gradle assembleDebug

 - 이름: APK 업로드
 용도: actions/upload-artifact@v4
 함께:
 이름: BubbleShort16BinaryGuardV1-debug-apk
 경로: 앱/빌드/outputs/APK/debug/앱-debug.APK
 if-no-files-found: 오류
